name: CI

# Railway (backend) et Vercel (frontend) redeploient automatiquement sur
# chaque push a main, independamment de ce workflow — pas de process de PR
# sur ce projet, tout part directement sur main. Le blocage reel se fait
# desormais au niveau du build lui-meme : les deux package.json ont un script
# "prebuild" (jest / vitest run) qui s'execute automatiquement avant "build"
# (convention npm) et fait echouer la commande si un test casse — Railway et
# Vercel executent tous deux `npm run build`, donc un test casse = pas de
# build = pas de deploiement, sans avoir besoin de gate GitHub Actions.
# Ce workflow CI reste utile en parallele pour avoir un check vert/rouge
# visible sur chaque commit/PR sans attendre le déploiement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check + lint + build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://backend-production-547d8.up.railway.app

      - name: Tests
        run: npm run test -- --run

  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
        env:
          # Aucune vraie base necessaire pour ces tests (pas de requete DB) —
          # juste une valeur syntaxiquement valide pour que PrismaClient
          # s'instancie sans erreur.
          DATABASE_URL: postgresql://user:password@localhost:5432/ci
