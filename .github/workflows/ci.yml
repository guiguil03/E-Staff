name: CI

# Gate = build (+ type-check/lint) et deploiement uniquement. Les tests
# (unitaires front/back et E2E Playwright) tournent toujours et remontent
# leur statut dans l'onglet Checks, mais ne font plus echouer la CI ni
# bloquer de deploiement — voir `continue-on-error` sur les steps/jobs de
# test ci-dessous. Les scripts "prebuild" qui lancaient les tests avant le
# build (package.json / backend/package.json) ont ete retires pour la meme
# raison : `npm run build` ne doit plus pouvoir echouer a cause d'un test.
#
# Railway (backend) redeploie automatiquement sur chaque push a main,
# independamment de ce workflow — pas de process de PR sur ce projet, tout
# part directement sur main. Railway execute `npm run build`, qui ne depend
# plus des tests (voir ci-dessus).
#
# Vercel (frontend), en revanche, est piloté explicitement par les jobs
# deploy-vercel* ci-dessous plutot que par l'auto-deploy Git de Vercel : le
# deploiement ne part que si le job `frontend` (build) est vert — les tests
# de ce job sont non-bloquants, donc un test casse n'empeche plus le
# deploiement. L'auto-deploy Git de Vercel doit rester desactive cote
# dashboard Vercel (Project Settings > Git) pour eviter un deploiement
# parallele qui ignorerait ce gate — voir README/discussion pour le detail
# du setup (secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID).
#
# Environnements : push sur `main` -> Vercel production (domaine .com) +
# backend Railway "production". Push sur `develop` -> Vercel preview (URL
# stable e-staf.vercel.app) + backend Railway "staging", chacun avec sa
# propre base de donnees. Voir docs/environments.md pour le runbook complet.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check + lint + build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://backend-production-547d8.up.railway.app

      # Non-bloquant : remonte dans Checks mais ne fait plus echouer le job
      # ni le deploiement Vercel qui en depend (needs: [frontend]).
      - name: Tests
        run: npm run test -- --run
        continue-on-error: true

  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      # Non-bloquant : remonte dans Checks mais ne fait plus echouer le job.
      - name: Tests
        run: npm run test
        continue-on-error: true
        env:
          # Aucune vraie base necessaire pour ces tests (pas de requete DB) —
          # juste une valeur syntaxiquement valide pour que PrismaClient
          # s'instancie sans erreur.
          DATABASE_URL: postgresql://user:password@localhost:5432/ci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Non-bloquant : un e2e flaky/casse ne doit pas marquer tout le run CI
    # en echec alors que build + deploiement sont bons (rien ne depend de
    # ce job via `needs`, donc il ne bloquait deja pas le deploiement —
    # ceci evite juste qu'il fasse passer le run global en rouge).
    continue-on-error: true
    # Pas de bloc `services:` : `npm run test:e2e` démarre lui-même Postgres
    # et MinIO via Docker (disponible nativement sur ce runner) s'ils ne
    # tournent pas déjà, AVANT de lancer Playwright (hook npm
    # `pretest:e2e` -> e2e/ensure-infra.mjs) — jamais la base/bucket
    # Railway de dev/prod (voir backend/.env). Même mécanisme qu'en local.
    #
    # Historique (2026-10-08) : cette logique vivait dans le hook
    # `globalSetup` de Playwright, qui démarre en réalité APRES les process
    # `webServer` (donc après le backend) — sur un runner CI tout neuf, rien
    # n'écoutait encore sur Postgres quand le backend tentait de s'y
    # connecter, d'où l'échec systématique de ce job. Voir
    # e2e/ensure-infra.mjs pour le détail.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      # Sans ça, un échec n'est diagnosticable que via l'annotation "github"
      # (titre + message générique) — jamais le détail (capture d'écran,
      # trace, étape qui a échoué). `if: always()` : utile aussi bien quand
      # le job échoue que pour inspecter un run vert en cas de doute.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-vercel-dev:
    name: Deploy to Vercel (dev)
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Environnement "Preview" cote Vercel : ses variables (notamment
      # NEXT_PUBLIC_API_URL) doivent pointer vers le backend Railway
      # "staging", pas vers la prod. A configurer une fois dans le
      # dashboard Vercel (Project Settings > Environment Variables >
      # Preview) — voir docs/environments.md.
      - name: Pull Vercel environment info (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      # Alias fixe pour ne pas avoir une URL differente a chaque deploiement.
      # Le nom "e-staf" doit etre libre sur vercel.app ; sinon
      # l'adapter ici et dans docs/environments.md.
      - name: Alias to stable dev URL
        run: vercel alias set ${{ steps.deploy.outputs.url }} e-staf.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
