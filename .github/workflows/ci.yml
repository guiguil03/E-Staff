name: CI

# Railway (backend) redeploie automatiquement sur chaque push a main,
# independamment de ce workflow — pas de process de PR sur ce projet, tout
# part directement sur main. Le blocage se fait au niveau du build lui-meme :
# backend/package.json a un script "prebuild" (jest) qui s'execute
# automatiquement avant "build" et fait echouer la commande si un test
# casse — Railway execute `npm run build`, donc un test casse = pas de
# build = pas de deploiement Railway, sans avoir besoin de gate ici.
#
# Vercel (frontend), en revanche, est piloté explicitement par le job
# deploy-vercel ci-dessous plutot que par l'auto-deploy Git de Vercel : le
# deploiement en prod ne part que si le job `frontend` (build + tests) est
# vert. L'auto-deploy Git de Vercel doit rester desactive cote dashboard
# Vercel (Project Settings > Git) pour eviter un deploiement parallele qui
# ignorerait ce gate — voir README/discussion pour le detail du setup
# (secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check + lint + build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://backend-production-547d8.up.railway.app

      - name: Tests
        run: npm run test -- --run

  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
        env:
          # Aucune vraie base necessaire pour ces tests (pas de requete DB) —
          # juste une valeur syntaxiquement valide pour que PrismaClient
          # s'instancie sans erreur.
          DATABASE_URL: postgresql://user:password@localhost:5432/ci

  deploy-vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
